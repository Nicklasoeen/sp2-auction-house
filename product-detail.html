<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listing</title>
  </head>
  <body class="bg-white text-charcoal">
    <div id="nav-root"></div>

    <main class="px-6 py-10 md:px-16 md:py-14">
      <div class="mx-auto w-full max-w-[1280px]">
        <p id="breadcrumb" class="text-sm text-charcoal/60">
          Home / Browse / ...
        </p>

        <section class="mt-8 grid gap-8 md:grid-cols-2 md:gap-12">
          <div>
            <img
              id="main-image"
              src=""
              alt=""
              class="w-full rounded-2xl bg-stone object-cover"
              style="aspect-ratio: 4 / 3"
            />
            <div id="thumbnail-row" class="mt-3 flex gap-2"></div>
          </div>

          <aside class="rounded-2xl border border-stone bg-white p-6 md:p-8">
            <div class="flex items-start justify-between gap-4">
              <h1 id="listing-title" class="text-2xl font-bold"></h1>
              <span
                class="rounded-full bg-charcoal px-3 py-1 text-xs font-medium uppercase tracking-wide text-white"
              >
                Auction
              </span>
            </div>

            <div class="mt-8">
              <p
                class="text-xs font-medium uppercase tracking-wide text-charcoal/60"
              >
                Current bid
              </p>
              <span
                id="current-bid"
                class="mt-2 block text-4xl font-bold text-forest"
              ></span>
              <span id="bid-count" class="mt-2 block text-sm opacity-60"></span>
            </div>

            <dl class="mt-8 border-t border-stone">
              <div
                class="flex items-center justify-between gap-4 border-b border-stone py-4 text-sm"
              >
                <dt class="text-charcoal/60">Time left</dt>
                <dd id="time-left" class="font-medium"></dd>
              </div>
              <div
                class="flex items-center justify-between gap-4 border-b border-stone py-4 text-sm"
              >
                <dt class="text-charcoal/60">Listed by</dt>
                <dd id="seller-name" class="font-medium"></dd>
              </div>
            </dl>

            <div class="mt-8">
              <label for="bid-amount" class="block text-sm font-medium"
                >Your bid</label
              >
              <input
                type="number"
                id="bid-amount"
                placeholder="Enter your bid"
                class="mt-2 w-full rounded-lg border border-stone px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              />
              <button
                id="place-bid-btn"
                type="button"
                class="mt-4 w-full rounded-lg bg-forest py-3 font-medium text-white transition-colors hover:bg-forest/90"
              >
                Place Bid
              </button>
              <p class="mt-3 text-center text-xs text-charcoal/60">
                Every bid is binding and final.
              </p>
              <p id="bid-error" class="mt-2 hidden text-sm text-red-600"></p>
            </div>
          </aside>
        </section>

        <section class="mt-16 max-w-3xl">
          <h2 class="text-2xl font-semibold">Description</h2>
          <p
            id="listing-description"
            class="mt-4 leading-relaxed text-charcoal/75"
          ></p>
        </section>

        <section class="mt-16 max-w-3xl">
          <h2 class="text-2xl font-semibold">Bid history</h2>
          <div
            id="bid-history-list"
            class="mt-4 overflow-hidden rounded-2xl border border-stone"
          >
            <p class="px-5 py-4 text-sm text-charcoal/60">No bids yet</p>
          </div>
        </section>
      </div>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="/src/product-detail.ts"></script>
  </body>
</html>
