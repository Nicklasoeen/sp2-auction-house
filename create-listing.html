<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List your gear</title>
  </head>
  <body class="bg-white text-charcoal">
    <div id="nav-root"></div>

    <main>
      <section class="bg-stone px-6 py-14 md:px-16 md:py-20">
        <div class="mx-auto w-full max-w-[1280px]">
          <p class="text-sm text-charcoal/60">Home / Sell Your Gear</p>
          <h1 id="page-title" class="mt-3 text-4xl font-semibold md:text-5xl">
            List your gear
          </h1>
        </div>
      </section>

      <section class="px-6 py-10 md:px-16 md:py-14">
        <form
          id="listing-form"
          class="mx-auto flex w-full max-w-[720px] flex-col gap-6"
        >
          <div class="flex flex-col gap-2">
            <label for="title" class="text-sm font-medium text-charcoal"
              >Listing title</label
            >
            <input
              type="text"
              id="title"
              required
              class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="deadline" class="text-sm font-medium text-charcoal"
              >Deadline date</label
            >
            <input
              type="date"
              id="deadline"
              required
              class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-charcoal"
              >Media gallery</label
            >
            <div id="media-inputs" class="flex flex-col gap-3">
              <input
                type="url"
                placeholder="https://..."
                class="media-url-input w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              />
            </div>
            <button
              type="button"
              id="add-media-btn"
              class="mt-1 self-start text-sm font-medium text-forest hover:underline"
            >
              + Add another photo
            </button>
          </div>

          <div class="flex flex-col gap-2">
            <label for="description" class="text-sm font-medium text-charcoal"
              >Description</label
            >
            <textarea
              id="description"
              rows="5"
              required
              class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
            ></textarea>
          </div>

          <p id="form-error" class="hidden text-sm text-red-600"></p>

          <div class="flex flex-wrap items-center gap-4">
            <button
              type="submit"
              id="submit-btn"
              class="rounded-lg bg-forest px-8 py-3 text-white"
            >
              Publish Listing
            </button>
            <a
              href="/browse.html"
              class="rounded-lg border border-stone px-8 py-3 text-charcoal hover:bg-stone"
            >
              Cancel
            </a>
            <button
              type="button"
              id="delete-btn"
              class="hidden rounded-lg border border-red-600 bg-white px-8 py-3 text-red-600"
            >
              Delete Listing
            </button>
          </div>
        </form>
      </section>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="/src/create-listing.ts"></script>
  </body>
</html>
