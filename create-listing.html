<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/rekit-fav.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List your gear</title>
  </head>
  <body class="bg-white text-charcoal">
    <div id="nav-root"></div>

    <main>
      <section class="bg-stone px-6 py-14 md:px-16 md:py-20">
        <div class="mx-auto w-full max-w-[1280px]">
          <p class="text-sm text-charcoal/60">Home / Sell Your Gear</p>
          <h1 id="page-title" class="mt-3 text-4xl font-semibold md:text-5xl">
            List your gear
          </h1>
        </div>
      </section>

      <section class="px-6 py-10 md:px-16 md:py-14">
        <form
          id="listing-form"
          class="mx-auto flex w-full max-w-[1020px] flex-col gap-7"
        >
          <div class="flex flex-col gap-2">
            <label for="title" class="text-sm font-medium text-charcoal"
              >Listing title</label
            >
            <input
              type="text"
              id="title"
              required
              placeholder="e.g. Golf accessories bundle"
              class="w-full max-w-[622px] rounded-lg border border-stone bg-white px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
            />
          </div>

          <div class="grid max-w-[622px] gap-5 md:grid-cols-2">
            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium text-charcoal" for="category"
                >Category</label
              >
              <select
                id="category"
                required
                class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-sm text-charcoal/50 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              >
                <option value="">Select a category</option>
                <option value="golf">Golf</option>
                <option value="tennis">Tennis</option>
                <option value="ski-snow">Ski &amp; Snow</option>
                <option value="running">Running</option>
                <option value="cycling">Cycling</option>
                <option value="team-sports">Team Sports</option>
                <option value="general">General</option>
              </select>
            </div>

            <div class="flex flex-col gap-2">
              <label
                class="text-sm font-medium text-charcoal"
                for="listing-type"
                >Listing type</label
              >
              <select
                id="listing-type"
                class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-sm text-charcoal/50 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              >
                <option>Auction</option>
              </select>
            </div>

            <div class="flex flex-col gap-2">
              <label
                class="text-sm font-medium text-charcoal"
                for="starting-price"
                >Starting price / bid ($)</label
              >
              <input
                id="starting-price"
                type="number"
                min="0"
                placeholder="45"
                class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              />
            </div>

            <div class="flex flex-col gap-2">
              <label for="deadline" class="text-sm font-medium text-charcoal"
                >Deadline date</label
              >
              <input
                type="date"
                id="deadline"
                required
                class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              />
            </div>
          </div>

          <div class="flex max-w-[622px] flex-col gap-2">
            <label class="text-sm font-medium text-charcoal"
              >Media gallery</label
            >
            <div
              id="media-inputs"
              class="flex min-h-[138px] flex-col justify-center gap-3 rounded-xl border-2 border-dashed border-sage bg-stone px-6 py-7"
            >
              <input
                type="url"
                placeholder="Image URL"
                class="media-url-input mx-auto w-full max-w-[460px] rounded-lg border border-stone bg-white px-4 py-2.5 text-sm text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
              />
            </div>
            <button
              type="button"
              id="add-media-btn"
              class="self-start text-sm font-medium text-forest hover:underline"
            >
              + Add another photo
            </button>
          </div>

          <div class="flex max-w-[622px] flex-col gap-2">
            <label for="description" class="text-sm font-medium text-charcoal"
              >Description</label
            >
            <textarea
              id="description"
              rows="6"
              required
              placeholder="Describe the condition, brand, and why you're selling or swapping it..."
              class="w-full rounded-lg border border-stone bg-white px-4 py-3 text-charcoal placeholder:text-charcoal/40 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/20"
            ></textarea>
          </div>

          <p id="form-error" class="hidden text-sm text-red-600"></p>

          <div class="flex flex-wrap items-center gap-3">
            <button
              type="submit"
              id="submit-btn"
              class="rounded-lg bg-forest px-7 py-3 text-sm text-white transition-colors hover:bg-forest/90"
            >
              Publish Listing
            </button>
            <a
              href="./browse.html"
              class="rounded-lg border border-stone px-7 py-3 text-sm text-charcoal hover:bg-stone"
            >
              Cancel
            </a>
            <button
              type="button"
              id="delete-btn"
              class="hidden rounded-lg border border-red-600 bg-white px-7 py-3 text-sm text-red-600"
            >
              Delete Listing
            </button>
          </div>
        </form>
      </section>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="./src/create-listing.ts"></script>
  </body>
</html>
